services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-app-frontend
    ports:
      - "8081:3000"
    depends_on:
      - backend
    networks:
      - chat-app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-app-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@mongodb:27017/chatapp?authSource=admin
      # Add other env vars as needed
    depends_on:
      - mongodb
    networks:
      - chat-app-network

  mongodb:
    build:
      context: ./mongoDB
      dockerfile: Dockerfile
    container_name: chat-app-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_persistent_data:/data/db
    networks:
      - chat-app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_persistent_data:

networks:
  chat-app-network:
    driver: bridge